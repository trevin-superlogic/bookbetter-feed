name: Experiences feed

# Reads the experiences site once a day and commits data/experiences.json when it changes.
# The source address lives in a secret so it is not written anywhere in this repo.

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      debug:
        description: "Save the raw page text as a private artifact (contains prices)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: experiences-feed
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull experiences
        env:
          SOURCE_URL: ${{ secrets.EXPERIENCES_SOURCE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          BLOCKLIST: ${{ secrets.EXPERIENCES_BLOCKLIST }}
          DETAIL_PATTERN: ${{ vars.EXPERIENCES_DETAIL_PATTERN }}
          DEBUG_DIR: ${{ inputs.debug && 'debug-raw' || '' }}
        run: node scripts/pull-experiences.mjs

      - name: Upload raw text for tuning
        if: ${{ always() && inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: experiences-raw
          path: debug-raw
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/experiences.json)" ]; then
            git config user.name "experiences-feed"
            git config user.email "actions@users.noreply.github.com"
            git add data/experiences.json
            git commit -m "Update experiences feed"
            git push
          else
            echo "No change."
          fi
